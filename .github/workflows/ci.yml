name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Variables EXPLÍCITAS de CI: URLs https dummy válidas (la validación de producción exige https y no-localhost).
    # NO son secretos ni apuntan a ningún servicio real.
    env:
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_API_URL: https://api.ci.example.com
      NEXT_PUBLIC_SITE_URL: https://ci.example.com
      NEXT_PUBLIC_WOMPI_PUBLIC_KEY: ""
      NEXT_PUBLIC_INDEXABLE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck

      # En CI NO hay API: `https://api.ci.example.com` no existe. El build debe completarse igualmente porque el
      # contenido del CMS (home, layout, colecciones) cae a sus valores por defecto cuando la API no responde.
      # Si el build empieza a fallar aquí por "fetch failed", falta ese fallback en la ruta indicada: arréglalo en el
      # código (no levantes una API en CI).
      - run: yarn build

      - name: Comprobar salida standalone (Docker)
        run: test -f .next/standalone/server.js
